<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
// viewport-fit=cover: راجع التعليق التفصيلي بـindex.html — بدونها كروم بيحجز هامش أمان تلقائي
// حوالين بروز الكاميرا بوضعية عرضية، وهاد بالضبط سبب الفراغ الجانبي حوالين الهيدر/الخلفية.
// نفس تقنية index.html: بوضعية landscape وعرض شاشة أضيق من 1280، نخلي الصفحة تتصرّف وكأنها بعرض
// 1280 (نسخة كمبيوتر) — راجع التعليق التفصيلي بـindex.html.
(function(){
  var META_W = 1280;
  // مصدر "العرض الحقيقي" الأصغر بين screen.width وinnerWidth، بلا تخزين مؤقّت — راجع التعليق
  // التفصيلي بـindex.html (نفس المشكلة: بعض المتصفحات بترجّع screen.width غلط بوضعية عرضية).
  function realWidth(){
    var candidates = [];
    if(innerWidth > 0) candidates.push(innerWidth);
    if(screen.width > 0) candidates.push(screen.width);
    candidates = candidates.filter(function(w){ return w >= 100 && w <= 4000; });
    if(!candidates.length) return innerWidth || 375;
    return Math.min.apply(null, candidates);
  }
  function apply(){
    var meta = document.querySelector('meta[name="viewport"]');
    var landscape = matchMedia('(orientation:landscape)').matches;
    var rw = realWidth();
    var need = landscape && rw > 0 && rw < META_W;
    var want;
    if(need){
      var scale = rw / META_W;
      want = (scale > 0 && scale <= 1)
        ? ('width='+META_W+', initial-scale='+scale+', minimum-scale='+scale+', maximum-scale='+scale+', user-scalable=no, viewport-fit=cover')
        : 'width=device-width, initial-scale=1, viewport-fit=cover';
    } else {
      want = 'width=device-width, initial-scale=1, viewport-fit=cover';
    }
    if(meta.getAttribute('content') !== want) meta.setAttribute('content', want);
  }
  apply();   // بلا setTimeout بعدها — أي تعديل عالـmeta بعد ما الصفحة بلشت ترندر بيسبب خلل بصري (راجع index.html)
  addEventListener('resize', apply);
  addEventListener('orientationchange', apply);

  // تعويض انزياح العناصر الثابتة عن حافة الشاشة المرئية بالقياس الفعلي — راجع التعليق التفصيلي بـindex.html
  function syncFixedShift(){
    if(!document.body) return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;visibility:hidden;pointer-events:none;margin:0;border:0;padding:0;transform:none;z-index:-1';
    document.body.appendChild(probe);
    var shift = probe.getBoundingClientRect().left;
    probe.remove();
    if(!isFinite(shift)) shift = 0;
    document.documentElement.style.setProperty('--vv-offset-x', (-shift) + 'px');
  }
  function scheduleShift(){
    syncFixedShift();
    requestAnimationFrame(syncFixedShift);
    setTimeout(syncFixedShift, 150);
  }
  window.__syncFixedShift = scheduleShift;
  if(document.readyState === 'loading') addEventListener('DOMContentLoaded', scheduleShift);
  else scheduleShift();
  addEventListener('resize', scheduleShift);
  addEventListener('orientationchange', scheduleShift);
  if(window.visualViewport){
    visualViewport.addEventListener('resize', scheduleShift);
    visualViewport.addEventListener('scroll', scheduleShift);
  }
})();
</script>
